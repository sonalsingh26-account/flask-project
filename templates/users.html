<!DOCTYPE html>
<html>
<head>
    <title>Users Detail</title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous"></link>
</head>
<body>
	<header>
		<h1>Users Data</h1>
	</header> 
	<div>
	{% for user in users %}
		<hr>
			
			<br> Id - {{user.id}} 
			<br> Name - {{user.name}} 
			<br> Email - {{user.email}} 
			<br> Age - {{user.age}} 
			
		</hr>
	</div>
	{% endfor %}
	</div>
	<hr>
    <a href="/">Click for Home Page</a>
	</hr>
	</body>
	<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
